# ==========================================
# CONFIGURA\u00C7\u00D5ES DA APLICA\u00C7\u00C3O
# ==========================================
spring.application.name=microservico-radares-bff
spring.threads.virtual.enabled=true

# ==========================================
# CONFIG SERVER & SERVICE DISCOVERY (EUREKA)
# ==========================================
spring.config.import=optional:configserver:http://config-server:8888

# \u2705 CORRE\u00C7\u00C3O CR\u00CDTICA: Aponta para o Eureka no Docker para resolver o erro 503 do Gateway
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
# eureka.client.serviceUrl.defaultZone=http://192.168.0.6:8761/eureka/ (Use esta se o eureka-server falhar)
eureka.instance.prefer-ip-address=true

# ==========================================
# INTEGRA\u00C7\u00C3O COM OUTROS MICROSERVI\u00C7OS
# ==========================================
# Docker (Comunica\u00E7\u00E3o direta via compose):
# microservico.monitoramento.url=http://microservico-monitoramento:8089
# Docker para Host (Se o monitoramento roda na sua IDE Windows):
microservico.monitoramento.url=http://host.docker.internal:8089

# ==========================================
# SEGURAN\u00C7A (KEYCLOAK)
# ==========================================
# Unificado para usar o IP da sua rede (192.168.0.6) garantindo que o token seja lido corretamente
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.0.6:8180/realms/radares-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://192.168.0.6:8180/realms/radares-realm/protocol/openid-connect/certs

# ==========================================
# WEBSOCKET
# ==========================================
spring.messages.broker.application-destination-prefix=/app
spring.messages.broker.simple-broker.enabled=true
spring.messages.broker.simple-broker.prefixes=/topic,/queue

# ==========================================
# CACHE (REDIS)
# ==========================================
# \u2705 CORRE\u00C7\u00C3O: Usa o nome do container do Redis no Docker (ou host.docker.internal se rodar no Windows local)
spring.data.redis.host=redis
# spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379

# ==========================================
# ELASTICSEARCH
# ==========================================
elasticsearch.host=elasticsearch
elasticsearch.port=9200

# ==========================================
# CORS E WEB
# ==========================================
# Desabilita o CORS padr\u00E3o, pois j\u00E1 \u00E9 tratado pelo SecurityConfig
spring.web.cors.enabled=false
management.endpoints.web.cors.allowed-origins=
management.endpoints.web.cors.allowed-methods=

# ==========================================
# LOGS PARA DEBUG
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
logging.level.com.coruja=INFO

# Integra\u00E7\u00E3o DETRAN SP
detran.api.base-url=https://detran-veiculos.api.rota.sp.gov.br
detran.api.auth-url=https://idp.sp.gov.br/auth/realms/idpsp/protocol/openid-connect/token
detran.api.client-id=ssp.conexao-radar
detran.api.client-secret=46362112-13af-4518-995e-aff7dfaca67f

# Aumenta o tempo que o BFF espera as concession\u00E1rias antes de cortar
resilience4j.timelimiter.configs.default.timeoutDuration=120s

logging.level.org.springframework.messaging.simp.broker.SimpleBrokerMessageHandler=INFO

